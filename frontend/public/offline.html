<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Offline · CreatorOps</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center;
    background: #0a0a0a;
    color: #f5f5f5; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #a3a3a3; max-width: 28ch; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 26px; color: #fff; cursor: pointer;
    background: #e11d12; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>CreatorOps needs a connection to load your channel. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
