# Local development only. Production runs as separate Render services (see render.yaml).
#
# There is deliberately no Postgres service here: development uses the Postgres on
# your machine (see backend/scripts/setup_local_db.sh) and production uses Supabase.
# Containers reach the host database through host.docker.internal, so put this in
# backend/.env:
#   DATABASE_URL=postgresql+psycopg://bellz:<password>@host.docker.internal:5432/creatorops
# and make sure the local server listens beyond localhost and allows the Docker
# subnet in pg_hba.conf (listen_addresses, host ... scram-sha-256).
x-backend: &backend
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    REDIS_URL: redis://redis:6379/0   # DATABASE_URL comes from backend/.env
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./backend:/app
  depends_on:
    redis: { condition: service_started }

services:
  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.tasks:celery_app worker --loglevel=info --concurrency=2

  beat:  # exactly one instance, always
    <<: *backend
    command: celery -A app.tasks:celery_app beat --loglevel=info

  # frontend: added with the Next.js app (runs on Vercel in production)
